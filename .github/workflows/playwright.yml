name: Playwright Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1-5'          # régression complète la nuit (heure UTC)
  workflow_dispatch:               # lancement manuel depuis l'onglet Actions

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox

      - name: Smoke (pull request)
        if: github.event_name == 'pull_request'
        run: npx playwright test --grep @smoke --project=chromium

      - name: Régression complète
        if: github.event_name != 'pull_request'
        run: npx playwright test

      - name: Rapport HTML
        uses: actions/upload-artifact@v4
        if: always()               # surtout quand les tests échouent
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Résultats JUnit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results
          path: results/junit.xml
